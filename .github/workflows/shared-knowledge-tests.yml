name: Telegram shared knowledge checks
on:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m py_compile main.py test_shared_knowledge.py
      - run: python -m unittest -v test_shared_knowledge.py
